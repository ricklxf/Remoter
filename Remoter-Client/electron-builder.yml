appId: com.remoter.client
productName: Remoter
copyright: Copyright © 2024

directories:
  buildResources: build

# build/icon.png is excluded from `files` below (it's only there for
# electron-builder's own icon-generation step), so the running app has no
# way to load it at runtime for BrowserWindow's `icon` option — without
# this, the packaged .exe/.app gets the right icon on disk, but the actual
# running window's taskbar/dock icon falls back to Electron's own default
# logo. Copies it to resources/icon.png instead, which process.resourcesPath
# can reach at runtime — see main/index.ts.
extraResources:
  - from: build/icon.png
    to: icon.png

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.*}'
  - '!build/{icon,*}'

win:
  executableName: Remoter
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: Remoter-Setup-${version}.exe
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

# unpackDirName 默认按打包文件名（含版本号）算哈希，每次升版本号都会
# 解压到一个新的临时目录，导致 Windows 防火墙把它当成新程序反复弹窗
# 授权提示。固定成一个不含版本号的目录名，不管打多少个版本都解压到
# 同一路径，防火墙规则只需要放行一次。
portable:
  unpackDirName: RemoterPortable

mac:
  # identity: null → skip codesign; avoids "cannot be opened" when no Developer ID cert.
  # To enable signing: set identity to your "Developer ID Application: ..." fingerprint
  # and configure notarization via APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD env vars.
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.

linux:
  target:
    - AppImage
    - snap
  maintainer: electronjs.org
  category: Utility
