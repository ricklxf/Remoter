appId: com.remoter.client
productName: Remoter
copyright: Copyright © 2024

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.*}'
  - '!build/{icon,*}'

win:
  executableName: Remoter
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: Remoter-Setup-${version}.exe
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  # identity: null → skip codesign; avoids "cannot be opened" when no Developer ID cert.
  # To enable signing: set identity to your "Developer ID Application: ..." fingerprint
  # and configure notarization via APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD env vars.
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.

linux:
  target:
    - AppImage
    - snap
  maintainer: electronjs.org
  category: Utility
